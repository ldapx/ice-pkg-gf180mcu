[package]
schema_version = 1
name = "gf180mcu"
version = "0.1.0"
description = "GlobalFoundries GF180MCU 180 nm CMOS open-source PDK"
license = "Apache-2.0"

[source]
type = "git"
url = "https://github.com/google/gf180mcu-pdk.git"
revision = "main"

[provides]
pdk = true
models = true
symbols = true
layout = true
verification = true

[trust]
trusted = false

[pdk]
display_name = "GlobalFoundries GF180MCU"
default_schematic = "gf180mcu_top"

id = "gf180mcuA"
aliases = ["gf180mcu", "gf180mcua"]

[pdk.simulation]
engine = "ngspice"
root = "libs.tech/ngspice"
model_file = "sm141064.ngspice"
section = "typical"
includes = ["design.ngspice"]
options = []
requires_osdi = false

[pdk.simulation.devices]
nmos = "nfet_03v3"
pmos = "pfet_03v3"

